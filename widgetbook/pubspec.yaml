name: opencode_widgetbook
description: "Widgetbook catalog that renders the app's real screens with fake data."
publish_to: "none"
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: any
  flutter_riverpod: any
  clock: any
  flutter_secure_storage: any
  widgetbook: ^3.25.0
  opencode_mobile:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ^14.5.0
  flutter_lints: any

flutter:
  uses-material-design: true
  # The app declares its font families without a package prefix, so a package
  # that depends on it does not get them under those names. Register the same
  # families from the app's assets.
  fonts:
    - family: AppPhosphorRegular
      fonts:
        - asset: fonts/phosphor/Phosphor.ttf
    - family: AppPhosphorDuotone
      fonts:
        - asset: fonts/phosphor/Phosphor-Duotone.ttf
    - family: AppPhosphorFill
      fonts:
        - asset: fonts/phosphor/Phosphor-Fill.ttf
    - family: AppSans
      fonts:
        - asset: fonts/geist/Geist-Variable.ttf
        - asset: fonts/geist/Geist-Italic-Variable.ttf
          style: italic
    - family: AppMono
      fonts:
        - asset: fonts/geist/GeistMono-Variable.ttf
        - asset: fonts/geist/GeistMono-Italic-Variable.ttf
          style: italic
