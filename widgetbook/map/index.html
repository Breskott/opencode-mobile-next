<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App map</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1d1d1b;--mut:#6d6a63;--line:#e3e0d9;--acc:#2f6f4f;--chip:#eef3ef}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#21211e;--fg:#ecebe6;--mut:#9b988f;--line:#34332f;--acc:#7cc39b;--chip:#26332b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);z-index:2}
.tabs{display:flex;gap:8px}
.tabs button,.tabs a{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;text-align:center;text-decoration:none}
.tabs button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
#q{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
main{padding:12px 16px 40px;max-width:760px;margin:auto}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--card)}
.tw{width:20px;color:var(--mut);flex:none;text-align:center}
.th{width:34px;height:48px;border-radius:6px;background:var(--line);flex:none;object-fit:cover;object-position:top}
.nm{flex:1;min-width:0}.nm b{font-weight:600}.sub{color:var(--mut);font-size:13px}
.kids{margin-left:22px;border-left:1px solid var(--line);padding-left:6px}
.ref{color:var(--mut);font-size:13px;padding:4px 6px 4px 36px;cursor:pointer}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:24px 0 8px}
.focus{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;overflow-wrap:anywhere}
.pill i{display:block;font-style:normal;color:var(--mut);font-size:12px}
.mid{text-align:center}.mid img{width:170px;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto 6px;background:var(--card);cursor:pointer}
.mid .ph{width:170px;height:290px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--mut);margin:0 auto 6px;font-size:13px}
.mid a{color:var(--acc)}
.lbl{font-size:12px;color:var(--mut);text-align:center;margin-bottom:4px}
.empty{color:var(--mut);text-align:center;font-size:13px}
@media (max-width:560px){.focus{grid-template-columns:1fr}.mid{order:-1}}
</style></head><body>
<header>
  <div class="tabs"><button id="bTree" class="on" type="button">Sitemap</button><button id="bFocus" type="button">Focus</button><a href="../">Catalog</a></div>
  <input id="q" type="search" placeholder="Search screens" aria-label="Search screens" list="names">
  <datalist id="names"></datalist>
</header>
<main id="main"></main>
<script>
"use strict";
let M, byId = {}, out = {}, inn = {};
const ROOT = "HomeScreen";
const $ = (id) => document.getElementById(id);
const main = $("main");
const kindOf = (e) => e.via.includes("sheet") ? "sheet" : e.via.every((v) => v === "search") ? "search"
  : e.via.includes("launch") && e.via.every((v) => v === "launch") ? "deeplink" : "screen";
const human = (id) => {
  if (id.startsWith("@")) return id.slice(1).replace(/_/g, " ");
  let s = id.replace(/(Screen|Page|Sheet)$/, "").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/([A-Z])([A-Z][a-z])/g, "$1 $2").toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const useCase = (id) => (byId[id] && byId[id].useCases && byId[id].useCases[0]) || null;
const thumb = (id) => { const u = useCase(id); return u ? "../shots/" + u.shot + ".thumb.png" : null; };
const full = (id) => { const u = useCase(id); return u ? "../shots/" + u.shot + ".png" : null; };
const catalogUrl = (id) => { const u = useCase(id); return u ? "../#/?path=" + u.path : null; };
const img = (id) => { const t = thumb(id); return t ? `<img class="th" loading="lazy" src="${t}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'th'}))">` : '<span class="th"></span>'; };

function build() {
  for (const n of M.nodes) byId[n.id] = n;
  for (const e of M.edges) {
    if (!byId[e.to] || e.from === e.to) continue;
    (out[e.from] ??= []).push(e); (inn[e.to] ??= []).push(e);
  }
  const names = $("names");
  names.innerHTML = M.nodes.filter((n) => !n.id.startsWith("@")).map((n) => `<option value="${esc(human(n.id))}" data-id="${n.id}">`).join("");
}
const plain = (e) => !e.from.startsWith("@") && e.via.some((v) => v !== "search" && v !== "launch");
const kids = (id) => (out[id] || []).filter(plain).map((e) => e.to).filter((v, i, a) => a.indexOf(v) === i)
  .sort((a, b) => human(a).localeCompare(human(b)));

function tree() {
  main.innerHTML = ""; const seen = new Set();
  function node(id, depth) {
    const wrap = document.createElement("div");
    if (seen.has(id)) {
      const r = document.createElement("div"); r.className = "ref"; r.textContent = "↪ " + human(id) + " (shown above)";
      r.onclick = () => focus(id); wrap.append(r); return wrap;
    }
    seen.add(id);
    const ks = kids(id), r = document.createElement("div"); r.className = "row";
    const from = (inn[id] || []).filter(plain).length;
    r.innerHTML = `<span class="tw">${ks.length ? (depth < 1 ? "▾" : "▸") : ""}</span>${img(id)}<span class="nm"><b>${esc(human(id))}</b><div class="sub">${/Sheet/.test(id) ? "sheet" : "screen"}${ks.length ? " · opens " + ks.length : ""}${from > 1 ? " · from " + from + " places" : ""}</div></span>`;
    const box = document.createElement("div"); box.className = "kids";
    let open = depth < 1, built = false;
    const mk = () => { if (!built) { built = true; ks.forEach((k) => box.append(node(k, depth + 1))); } };
    if (open) mk(); else box.hidden = true;
    r.querySelector(".tw").onclick = (ev) => { ev.stopPropagation(); if (!ks.length) return; open = !open; mk(); box.hidden = !open; r.querySelector(".tw").textContent = open ? "▾" : "▸"; };
    r.querySelector(".nm").onclick = () => focus(id);
    r.querySelector(".th").onclick = (ev) => { const u = catalogUrl(id); if (u) { ev.stopPropagation(); location.href = u; } };
    wrap.append(r, box); return wrap;
  }
  main.append(node(ROOT, 0));
  const section = (title, list, sub) => {
    const h = document.createElement("h2"); h.textContent = `${title} (${list.length})`; main.append(h);
    for (const id of list) {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<span class="tw"></span>${img(id)}<span class="nm"><b>${esc(human(id))}</b><div class="sub">${esc(sub(id))}</div></span>`;
      r.onclick = () => focus(id); main.append(r);
    }
  };
  const named = (r) => M.nodes.filter((n) => n.reach === r).map((n) => n.id).sort((a, b) => human(a).localeCompare(human(b)));
  section("Not reachable from Home", named("none"), (id) => byId[id].file.replace("lib/ui/", ""));
  section("Opened only from search or notifications", named("entry-only"), (id) => {
    const from = (inn[id] || []).map((e) => human(e.from) + " (" + kindOf(e) + ")");
    return from.slice(0, 3).join(", ");
  });
  setTab("tree");
}

function focus(id) {
  if (!byId[id]) { tree(); return; }
  history.replaceState(null, "", "#" + id);
  const col = (edges, key, label) => {
    const items = edges.slice().sort((a, b) => human(a[key]).localeCompare(human(b[key])));
    return `<div class="col"><div class="lbl">${label}</div>${items.length ? items.map((e) => `<div class="pill" data-id="${e[key]}">${esc(human(e[key]))}<i>${kindOf(e)}</i></div>`).join("") : '<div class="empty">none</div>'}</div>`;
  };
  const f = full(id), u = catalogUrl(id);
  main.innerHTML = `<div class="focus">${col(inn[id] || [], "from", "Comes from")}<div class="mid">${f ? `<img src="${f}" alt="${esc(human(id))}" data-open="${esc(u)}" onerror="this.outerHTML='<div class=ph>no picture yet</div>'">` : '<div class="ph">no picture yet</div>'}<b>${esc(human(id))}</b><div class="sub">${esc(byId[id].file.replace("lib/ui/", ""))}</div>${u ? `<a href="${u}">Open in catalog (${byId[id].useCases.length} state${byId[id].useCases.length > 1 ? "s" : ""})</a>` : '<div class="sub">no use-case yet</div>'}</div>${col(out[id] || [], "to", "Opens")}</div>`;
  main.querySelectorAll(".pill").forEach((p) => (p.onclick = () => focus(p.dataset.id)));
  const im = main.querySelector("img[data-open]"); if (im) im.onclick = () => (location.href = im.dataset.open);
  setTab("focus"); scrollTo(0, 0);
}
function setTab(t) { $("bTree").classList.toggle("on", t === "tree"); $("bFocus").classList.toggle("on", t === "focus"); }
$("bTree").onclick = () => { history.replaceState(null, "", location.pathname); tree(); };
$("bFocus").onclick = () => focus(location.hash.slice(1) || "UsageHubScreen");
$("q").addEventListener("change", (e) => {
  const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const hit = M.nodes.find((n) => human(n.id).toLowerCase() === q) ||
    M.nodes.find((n) => (human(n.id) + " " + n.id + " " + n.file).toLowerCase().includes(q));
  if (hit) focus(hit.id);
});
addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && byId[id]) focus(id); });
fetch("map.json").then((r) => r.json()).then((d) => {
  M = d; build();
  const id = location.hash.slice(1);
  if (id && byId[id]) focus(id); else tree();
}).catch((e) => { main.textContent = "Could not load map.json: " + e; });
</script></body></html>
