<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Work — dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#0B0C0E}
.tk{--bg:#0B0C0E;--s1:#141518;--s2:#1B1C20;--s3:#26282D;--line:rgba(255,255,255,.07);--t1:#F3F3F1;--t2:#A3A5AB;--t3:#8A8D94;--on-acc:#03140B;--warn:#FFB547;--warn-bg:rgba(255,181,71,.09);--warn-line:rgba(255,181,71,.30);--badge:#FFB547;--mono-bg:rgba(0,0,0,.28);--fade:rgba(11,12,14,0);--nav:rgba(27,28,32,.82)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#3DDC8A}a:hover{color:#74E9AD}
</style>
</helmet>
<div class="tk" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--t1); font-family: Geist, 'Helvetica Neue', system-ui, sans-serif; --acc: {{accent}}">

<div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 0 20px; height: 44px; box-sizing: border-box">
<button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--s1); font-size: 13px; font-weight: 500; color: var(--t2)" aria-label="Server: Laptop, connected. Switch server">
<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--acc)"></span>Laptop
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</button>
<div style="flex-grow: 1"></div>
<button style="width: 44px; height: 44px; display: grid; place-items: center; color: var(--t2)" aria-label="Search">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
</button>
</div>

<div style="padding: 14px 20px 6px">
<button style="display: flex; align-items: center; gap: 6px; font-size: 32px; line-height: 38px; font-weight: 650; letter-spacing: -0.025em" aria-label="Project shopfront. Switch project">shopfront
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 6px"><path d="M6 9l6 6 6-6"/></svg>
</button>
<div style="margin-top: 4px; font-size: 14px; color: var(--t3); display: flex; align-items: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 3-11 6"/></svg>
main · 2 working · 1 needs you
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 22px; padding: 16px 16px 0">

<div style="background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 12px; align-items: flex-start">
<div style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; background: var(--warn-bg); color: var(--warn); display: grid; place-items: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<div style="font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--warn)">Needs you · 40 s ago</div>
<div style="font-size: 16px; line-height: 22px; font-weight: 550">Fix flaky checkout test wants to run a command</div>
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; color: var(--t2); background: var(--mono-bg); border-radius: 8px; padding: 7px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">flutter test test/checkout_test.dart</div>
</div>
</div>
<div style="display: flex; gap: 10px">
<button style="flex-grow: 1; height: 44px; border-radius: 13px; background: var(--s3); font-size: 15px; font-weight: 550">Open</button>
<button style="flex-grow: 1; height: 44px; border-radius: 13px; background: var(--acc); color: var(--on-acc); font-size: 15px; font-weight: 600">Allow once</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; padding: 0 4px; font-size: 13px; font-weight: 600; color: var(--t2)">Working now</div>
<div style="background: var(--s1); border-radius: 18px; overflow: hidden">
<button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; text-align: left; min-height: 60px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8" stroke-opacity=".22"/><path d="M20 12a8 8 0 0 0-8-8"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 500">Speed up the CI pipeline</span><span style="font-size: 13px; color: var(--t3)">Editing workflow files · 4 min</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</button>
<div style="height: 1px; background: var(--line); margin-left: 48px"></div>
<button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; text-align: left; min-height: 60px; box-sizing: border-box">
<span style="width: 20px; display: grid; place-items: center"><span style="width: 9px; height: 9px; border-radius: 50%; background: var(--warn)"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 500">Fix flaky checkout test</span><span style="font-size: 13px; color: var(--warn)">Waiting for you</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; padding: 0 4px; font-size: 13px; font-weight: 600; color: var(--t2)"><span style="flex-grow: 1">Recent</span><a href="#" style="font-weight: 500; text-decoration: none">See all</a></div>
<div style="background: var(--s1); border-radius: 18px; overflow: hidden">
<button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; text-align: left; min-height: 60px; box-sizing: border-box">
<span style="width: 20px; display: grid; place-items: center; color: var(--t3)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 500">Add dark mode to settings</span><span style="font-size: 13px; color: var(--t3)">4 files changed · 3 h ago</span></span>
</button>
<div style="height: 1px; background: var(--line); margin-left: 48px"></div>
<button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; text-align: left; min-height: 60px; box-sizing: border-box">
<span style="width: 20px; display: grid; place-items: center; color: var(--t3)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 500">Explain the payments module</span><span style="font-size: 13px; color: var(--t3)">Answered · yesterday</span></span>
</button>
</div>
</div>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 12px 10px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(to bottom, var(--fade), var(--bg) 34%)">
<div style="display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 7px 0 7px; border-radius: 27px; background: var(--s2); border: 1px solid var(--line)">
<button style="width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--t2)" aria-label="Attach">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<label for="new-convo" style="position: absolute; width: 1px; height: 1px; overflow: hidden">New conversation</label>
<input id="new-convo" placeholder="Start something in shopfront" style="flex-grow: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--t1); font: 15px Geist, system-ui, sans-serif">
<button style="height: 32px; padding: 0 10px; border-radius: 999px; background: var(--s3); font-size: 12.5px; font-weight: 550; color: var(--t2); display: flex; align-items: center; gap: 5px" aria-label="Who works on it: you and one agent. Switch to team">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="9" r="3.2"/><path d="M6 19c0-3.2 2.7-5 6-5s6 1.8 6 5"/></svg>Solo
</button>
<button style="width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--acc); color: var(--on-acc)" aria-label="Start">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
</button>
</div>
<nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 60px; border-radius: 22px; background: var(--nav); border: 1px solid var(--line); backdrop-filter: blur(18px)">
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--t1); font-size: 11px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Work</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--t3); font-size: 11px; font-weight: 500; position: relative">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/></svg>Inbox
<span style="position: absolute; top: 8px; left: 52%; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: var(--badge); color: #1A1000; font-size: 10.5px; font-weight: 700; line-height: 16px; text-align: center">1</span></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--t3); font-size: 11px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"/></svg>Project</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--t3); font-size: 11px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
</nav>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3DDC8A","options":["#3DDC8A","#5AB0FF","#FF8A4C","#C7A6FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#3DDC8A' };
  }
}
</script>
</body>
</html>
