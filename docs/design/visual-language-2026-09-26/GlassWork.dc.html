<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Work — liquid glass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#0B0C0E}
.tk{--bg:#0B0C0E;--s1:rgba(20,21,24,.92);--s3:#26282D;--line:rgba(255,255,255,.07);--t1:#F3F3F1;--t2:#A3A5AB;--t3:#8A8D94;--on-acc:#03140B;--warn:#FFB547}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#3DDC8A}a:hover{color:#74E9AD}
.glass{position:relative;isolation:isolate;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 42%,rgba(255,255,255,.09));box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 1px rgba(255,255,255,.08),inset 0 0 18px rgba(255,255,255,.05),0 12px 32px rgba(0,0,0,.42);backdrop-filter:blur(14px) saturate(175%) brightness(1.08);-webkit-backdrop-filter:blur(14px) saturate(175%) brightness(1.08)}
.glass.lens{backdrop-filter:blur(20px) saturate(180%) brightness(.82);-webkit-backdrop-filter:blur(20px) saturate(180%) brightness(.82)}
.glass.field{background:linear-gradient(140deg,rgba(255,255,255,.13),rgba(20,21,24,.45) 42%,rgba(20,21,24,.55))}
.glass.clear{background:linear-gradient(140deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 42%,rgba(255,255,255,.05));backdrop-filter:blur(5px) saturate(160%) brightness(.9);-webkit-backdrop-filter:blur(5px) saturate(160%) brightness(.9)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 90% at 18% 0%,rgba(255,255,255,.28),rgba(255,255,255,0) 46%),radial-gradient(80% 60% at 92% 110%,rgba(255,255,255,.12),rgba(255,255,255,0) 50%);mix-blend-mode:screen;z-index:-1}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;text-align:left;min-height:60px;box-sizing:border-box}
.sep{height:1px;background:var(--line);margin-left:48px}
.sub{font-size:13px;color:var(--t3)}
@media (prefers-reduced-transparency:reduce){.glass{backdrop-filter:blur(30px);background:rgba(40,42,46,.94)}}
</style>
</helmet>
<div class="tk" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--t1); font-family: Geist, 'Helvetica Neue', system-ui, sans-serif; --acc: #3DDC8A">
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><filter id="lens" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

<div style="position: absolute; left: -90px; top: -120px; width: 420px; height: 360px; border-radius: 50%; background: radial-gradient(closest-side, rgba(61,220,138,.26), rgba(61,220,138,0)); pointer-events: none"></div>
<div style="position: absolute; right: -140px; top: 150px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(closest-side, rgba(90,140,255,.20), rgba(90,140,255,0)); pointer-events: none"></div>
<div style="position: absolute; left: -60px; bottom: 60px; width: 360px; height: 300px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,181,71,.16), rgba(255,181,71,0)); pointer-events: none"></div>

<div style="position: absolute; left: 0; right: 0; top: 0; padding: 72px 16px 0; display: flex; flex-direction: column; gap: 20px">
<div style="padding: 0 4px">
<div style="font-size: 32px; line-height: 38px; font-weight: 650; letter-spacing: -0.025em">shopfront</div>
<div class="sub" style="font-size: 14px; margin-top: 4px">main · 2 working · 1 needs you</div>
</div>

<div style="background: rgba(255,181,71,.10); border: 1px solid rgba(255,181,71,.30); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 12px; font-weight: 600; color: var(--warn)">Needs you · 40 s ago</div>
<div style="font-size: 16px; line-height: 22px; font-weight: 550; margin-top: -8px">Fix flaky checkout test wants to run a command</div>
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; color: var(--t2); background: rgba(0,0,0,.3); border-radius: 8px; padding: 7px 9px">flutter test test/checkout_test.dart</div>
<div style="display: flex; gap: 10px">
<button style="flex-grow: 1; height: 44px; border-radius: 13px; background: var(--s3); font-size: 15px; font-weight: 550">Open</button>
<button style="flex-grow: 1; height: 44px; border-radius: 13px; background: var(--acc); color: var(--on-acc); font-size: 15px; font-weight: 600">Allow once</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="padding: 0 4px; font-size: 13px; font-weight: 600; color: var(--t2)">Working now</div>
<div style="background: var(--s1); border-radius: 18px; overflow: hidden">
<button class="row"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3DDC8A" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8" stroke-opacity=".22"/><path d="M20 12a8 8 0 0 0-8-8"/></svg><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 500">Speed up the CI pipeline</span><span class="sub">Editing workflow files · 4 min</span></span></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="padding: 0 4px; font-size: 13px; font-weight: 600; color: var(--t2)">Recent</div>
<div style="background: var(--s1); border-radius: 18px; overflow: hidden">
<button class="row"><span style="width: 20px; display: grid; place-items: center"><span style="width: 9px; height: 9px; border-radius: 50%; background: #3DDC8A"></span></span><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 500">Add dark mode to settings</span><span class="sub">4 files changed · 3 h ago</span></span></button>
<div class="sep"></div>
<button class="row"><span style="width: 20px; display: grid; place-items: center"><span style="width: 9px; height: 9px; border-radius: 50%; background: #7FB0FF"></span></span><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 500">Explain the payments module</span><span class="sub">Answered · yesterday</span></span></button>
<div class="sep"></div>
<button class="row"><span style="width: 20px; display: grid; place-items: center"><span style="width: 9px; height: 9px; border-radius: 50%; background: #FFB88A"></span></span><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 500">Speed up image loading</span><span class="sub">2 files changed · 3 d ago</span></span></button>
<div class="sep"></div>
<button class="row"><span style="width: 20px; display: grid; place-items: center"><span style="width: 9px; height: 9px; border-radius: 50%; background: #C7A6FF"></span></span><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 500">Upgrade Flutter to 3.47</span><span class="sub">Merged · last week</span></span></button>
</div>
</div>
</div>

<div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; align-items: center; gap: 8px">
<button class="{{glassClass}}" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 12px; font-size: 13.5px; font-weight: 550" aria-label="Server: Laptop, connected. Switch server"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3DDC8A; box-shadow: 0 0 8px #3DDC8A"></span>Laptop<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
<div style="flex-grow: 1"></div>
<button class="{{glassClass}}" style="width: 44px; height: 44px; display: grid; place-items: center" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
</div>

<div style="position: absolute; left: 12px; right: 12px; bottom: 14px; display: flex; flex-direction: column; gap: 10px">
<div class="{{glassClass}} field" style="display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 7px">
<button style="width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center" aria-label="Attach"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<label for="g-new" style="position: absolute; width: 1px; height: 1px; overflow: hidden">New conversation</label>
<input id="g-new" placeholder="Start something in shopfront" style="flex-grow: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--t1); font: 15px Geist, system-ui, sans-serif">
<button style="width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #3DDC8A; color: var(--on-acc); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 4px 14px rgba(61,220,138,.35)" aria-label="Start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</div>
<nav class="{{glassClass}}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 62px; padding: 5px; box-sizing: border-box; gap: 4px">
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--t1); font-size: 11px; font-weight: 600; border-radius: 999px; background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.25)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3DDC8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Work</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--t2); font-size: 11px; font-weight: 500; position: relative"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/></svg>Inbox<span style="position: absolute; top: 6px; left: 54%; min-width: 16px; height: 16px; border-radius: 8px; background: var(--warn); color: #1A1000; font-size: 10.5px; font-weight: 700; line-height: 16px; text-align: center">1</span></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--t2); font-size: 11px; font-weight: 500"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"/></svg>Project</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--t2); font-size: 11px; font-weight: 500"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
</nav>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["regular","clear","lens"],"default":"lens"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'lens';
    return { glassClass: v === 'clear' ? 'glass clear' : v === 'lens' ? 'glass lens' : 'glass' };
  }
}
</script>
</body>
</html>
